<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANI — Custom Pattern Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f1a; color: #e0e0e0;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 24px 32px; border-bottom: 1px solid #2a2a4a;
  }
  .header h1 { font-size: 24px; color: #4fc3f7; letter-spacing: 2px; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }
  .container {
    max-width: 1200px; margin: 0 auto; padding: 32px;
    display: grid; grid-template-columns: 380px 1fr; gap: 32px;
  }
  .form-panel {
    background: #1a1a2e; border-radius: 12px; padding: 24px;
    border: 1px solid #2a2a4a;
  }
  .form-panel h2 { font-size: 16px; color: #4fc3f7; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; color: #888;
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;
  }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #333; background: #0f0f1a; color: #e0e0e0;
    font-size: 14px;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: #4fc3f7;
  }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #4fc3f7; color: #0f0f1a; font-size: 15px;
    font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .btn:hover { background: #81d4fa; }
  .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  .result-panel {
    background: #1a1a2e; border-radius: 12px; padding: 24px;
    border: 1px solid #2a2a4a; min-height: 500px;
    display: flex; flex-direction: column;
  }
  .result-panel h2 { font-size: 16px; color: #4fc3f7; margin-bottom: 12px; }
  #viz-frame {
    flex: 1; border: none; border-radius: 8px;
    background: #0f0f1a; min-height: 450px;
  }
  .status-bar {
    display: flex; gap: 16px; margin-bottom: 12px;
    font-size: 13px; flex-wrap: wrap;
  }
  .status-bar .tag {
    padding: 4px 10px; border-radius: 6px;
    background: #2a2a4a; color: #aaa;
  }
  .status-bar .tag.ok { background: #1b5e20; color: #69f0ae; }
  .status-bar .tag.err { background: #b71c1c; color: #ff8a80; }
  .downloads { display: flex; gap: 12px; margin-top: 12px; }
  .downloads a {
    padding: 8px 16px; border-radius: 6px; text-decoration: none;
    background: #2a2a4a; color: #4fc3f7; font-size: 13px;
  }
  .downloads a:hover { background: #333; }
  .hidden { display: none; }
  #loading { text-align: center; padding: 40px; color: #666; }
  .garment-fields { transition: all 0.2s; }
  @media (max-width: 800px) {
    .container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>MANI</h1>
  <p>Custom Pattern Generator — enter your measurements, get a fitted pattern</p>
</div>
<div class="container">
  <div class="form-panel">
    <h2>Your Measurements</h2>
    <form id="form">
      <div class="field">
        <label>Garment Type</label>
        <select id="garment" onchange="toggleFields()">
          <option value="bodice">Bodice / Top</option>
          <option value="skirt">A-Line Skirt</option>
        </select>
      </div>
      <div class="field">
        <label>Units</label>
        <select id="units" onchange="toggleUnits()">
          <option value="cm">Centimeters (cm)</option>
          <option value="in">Inches (in)</option>
        </select>
      </div>
      <div id="bodice-fields" class="garment-fields">
        <div class="field">
          <label>Chest (<span class="unit-label">cm</span>)</label>
          <input type="number" id="chest" step="0.5" value="91.5">
        </div>
        <div class="field">
          <label>Shoulder Width (<span class="unit-label">cm</span>)</label>
          <input type="number" id="shoulder_width" step="0.5" value="40.0">
        </div>
        <div class="field">
          <label>Torso Length (<span class="unit-label">cm</span>)</label>
          <input type="number" id="torso_length" step="0.5" value="42.5">
        </div>
      </div>
      <div class="field">
        <label>Waist (<span class="unit-label">cm</span>)</label>
        <input type="number" id="waist" step="0.5" value="73.5">
      </div>
      <div class="field">
        <label>Hip (<span class="unit-label">cm</span>)</label>
        <input type="number" id="hip" step="0.5" value="98.0">
      </div>
      <div id="skirt-fields" class="garment-fields hidden">
        <div class="field">
          <label>Hip Depth (<span class="unit-label">cm</span>)</label>
          <input type="number" id="hip_depth" step="0.5" value="20.0">
        </div>
        <div class="field">
          <label>Desired Length (<span class="unit-label">cm</span>)</label>
          <input type="number" id="desired_length" step="0.5" value="70.0">
        </div>
      </div>
      <button type="submit" class="btn" id="gen-btn">Generate Pattern</button>
    </form>
  </div>
  <div class="result-panel">
    <h2>3D Preview</h2>
    <div id="status-area" class="hidden">
      <div class="status-bar">
        <span class="tag" id="s-status">—</span>
        <span class="tag" id="s-iters">—</span>
        <span class="tag" id="s-time">—</span>
        <span class="tag" id="s-garment">—</span>
      </div>
      <div class="downloads" id="downloads"></div>
    </div>
    <div id="loading" class="hidden">Generating your pattern...</div>
    <div id="viz-area" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:#555;font-family:sans-serif">
      <p>Enter measurements and click Generate</p>
    </div>
  </div>
</div>
<script>
function toggleFields() {
  const g = document.getElementById('garment').value;
  document.getElementById('bodice-fields').classList.toggle('hidden', g !== 'bodice');
  document.getElementById('skirt-fields').classList.toggle('hidden', g !== 'skirt');
}

const CM_DEFAULTS = {chest:91.5, shoulder_width:40.0, torso_length:42.5, waist:73.5, hip:98.0, hip_depth:20.0, desired_length:70.0};
const IN_DEFAULTS = {chest:36.0, shoulder_width:15.7, torso_length:16.7, waist:29.0, hip:38.6, hip_depth:7.9, desired_length:27.6};
const CM_PER_INCH = 2.54;

function toggleUnits() {
  const u = document.getElementById('units').value;
  const defs = u === 'in' ? IN_DEFAULTS : CM_DEFAULTS;
  const suffix = u === 'in' ? 'in' : 'cm';
  ['chest','shoulder_width','torso_length','waist','hip','hip_depth','desired_length'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = defs[id]; el.step = u === 'in' ? '0.1' : '0.5'; }
  });
  document.querySelectorAll('.unit-label').forEach(el => el.textContent = suffix);
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('gen-btn');
  const loading = document.getElementById('loading');
  const statusArea = document.getElementById('status-area');

  btn.disabled = true;
  btn.textContent = 'Generating...';
  loading.classList.remove('hidden');
  statusArea.classList.add('hidden');

  const g = document.getElementById('garment').value;
  const u = document.getElementById('units').value;
  const toCm = (v) => u === 'in' ? v * CM_PER_INCH : v;

  const body = {
    garment_type: g,
    waist: toCm(parseFloat(document.getElementById('waist').value)),
    hip: toCm(parseFloat(document.getElementById('hip').value)),
  };
  if (g === 'bodice') {
    body.chest = toCm(parseFloat(document.getElementById('chest').value));
    body.shoulder_width = toCm(parseFloat(document.getElementById('shoulder_width').value));
    body.torso_length = toCm(parseFloat(document.getElementById('torso_length').value));
  } else {
    body.hip_depth = toCm(parseFloat(document.getElementById('hip_depth').value));
    body.desired_length = toCm(parseFloat(document.getElementById('desired_length').value));
  }

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      alert('Error: ' + (data.detail || JSON.stringify(data)));
      return;
    }

    // Update status
    const sStatus = document.getElementById('s-status');
    sStatus.textContent = data.status;
    sStatus.className = 'tag ' + (data.status === 'converged' ? 'ok' : 'err');
    document.getElementById('s-iters').textContent = data.iterations + ' iterations';
    document.getElementById('s-time').textContent = data.elapsed_ms + ' ms';
    document.getElementById('s-garment').textContent = data.garment_type;
    statusArea.classList.remove('hidden');

    // Downloads — only show if available
    const dl = document.getElementById('downloads');
    dl.innerHTML = '';
    if (data.garment_type === 'bodice') {
      dl.innerHTML += `<a href="/api/download/${data.run_id}/dxf" download="pattern_${data.run_id}.dxf">⬇ Download DXF</a>`;
      dl.innerHTML += `<a href="/api/download/${data.run_id}/pdf" download="pattern_${data.run_id}.pdf">⬇ Download PDF</a>`;
    }

    // Load visualization — open in new tab for full 3D experience
    const vizBtn = document.createElement('a');
    vizBtn.href = `/api/visualization/${data.run_id}`;
    vizBtn.target = '_blank';
    vizBtn.className = 'btn';
    vizBtn.style.display = 'inline-block';
    vizBtn.style.width = 'auto';
    vizBtn.style.marginTop = '12px';
    vizBtn.style.textDecoration = 'none';
    vizBtn.style.textAlign = 'center';
    vizBtn.textContent = '🔍 Open 3D Visualization';

    const vizArea = document.getElementById('viz-area');
    vizArea.innerHTML = '';
    vizArea.appendChild(vizBtn);

    // Also show a summary
    const summary = document.createElement('div');
    summary.style.cssText = 'margin-top:16px;padding:16px;background:#0f0f1a;border-radius:8px;font-size:13px;color:#aaa;';
    summary.innerHTML = `
      <p style="color:#4fc3f7;font-size:15px;margin-bottom:8px">Pattern generated successfully</p>
      <p>Status: <span style="color:#69f0ae">${data.status}</span></p>
      <p>Self-correction iterations: ${data.iterations}</p>
      <p>Garment: ${data.garment_type}</p>
      <p>Engine time: ${data.elapsed_ms}ms</p>
      <p style="margin-top:12px;color:#666">Click "Open 3D Visualization" to see the pattern draped on a mannequin with the iteration slider.</p>
    `;
    vizArea.appendChild(summary);

    loading.classList.add('hidden');

  } catch (err) {
    alert('Network error: ' + err.message);
    loading.classList.add('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Pattern';
  }
});
</script>
</body>
</html>
